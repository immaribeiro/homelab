model:
  default: deepseek/deepseek-v4-flash
  provider: nous
  base_url: ''
  api_key_env: OPENAI_API_KEY
fallback_providers:
  '0':
    provider: lmstudio
    model: google/gemma-4-e4b
    base_url: http://localhost:1234/v1
  '1':
    provider: nous
    model: z-ai/glm-5.2
agent:
  max_turns: 150
  reasoning_effort: low
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: false
  coding_context: auto
  disabled_toolsets:
  - tts
  - image_gen
  - video
  - video_gen
terminal:
  backend: local
  cwd: /Users/imma/GitHub
display:
  interface: cli
  personality: concise
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
delegation:
  model: gpt-5.6-luna
  provider: openai
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  max_iterations: 250
  max_concurrent_children: 10
  max_spawn_depth: 1
custom_providers:
- name: lmstudio
  base_url: http://localhost:1234/v1
  model: google/gemma-4-e4b
  models:
  - qwen3.5-9b-mlx
  - google/gemma-4-e4b
