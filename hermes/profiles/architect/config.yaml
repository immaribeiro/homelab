model:
  default: deepseek/deepseek-v4-pro-0813
  provider: nous
  base_url: ''
  api_key_env: OPENAI_API_KEY
fallback_providers:
  '0':
    provider: nous
    model: z-ai/glm-5.2
  '1':
    provider: lmstudio
    model: qwen3.5-9b-mlx
    base_url: http://localhost:1234/v1
agent:
  max_turns: 120
  reasoning_effort: high
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: false
  coding_context: auto
  disabled_toolsets:
  - tts
  - image_gen
  - video
  - video_gen
terminal:
  backend: local
  cwd: /Users/imma/GitHub
display:
  interface: cli
  personality: technical
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
delegation:
  model: openai/gpt-5.6-luna
  provider: nous
  max_iterations: 250
  max_concurrent_children: 5
  max_spawn_depth: 1
custom_providers:
- name: lmstudio
  base_url: http://localhost:1234/v1
  model: qwen3.5-9b-mlx
  models:
  - qwen3.5-9b-mlx
  - google/gemma-4-e4b
